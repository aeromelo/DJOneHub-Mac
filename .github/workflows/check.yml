name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  logic:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s src -p 'test_*.py' -v
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
